name: Android Build

on:
  push:
    branches: [ main, develop, android/* ]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        target: default
        arch: x86_64

    - name: Install npm dependencies
      run: npm ci --verbose

    - name: Sync Capacitor to Android
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      working-directory: ${{ github.workspace }}

    - name: Validate Gradle wrapper
      run: |
        cd android
        ls -la gradle/wrapper/
        ./gradlew -version

    - name: Build Android APK (Debug)
      run: |
        cd android
        ./gradlew clean assembleDebug
      env:
        GRADLE_OPTS: -Xmx2048m
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Build Android Bundle (Release)
      run: |
        cd android
        ./gradlew bundleRelease
      env:
        GRADLE_OPTS: -Xmx2048m
        JAVA_HOME: ${{ env.JAVA_HOME }}
      continue-on-error: true

    - name: Check build outputs
      run: |
        echo "=== Checking APK output ==="
        if [ -d "android/app/build/outputs/apk/debug" ]; then
          ls -la android/app/build/outputs/apk/debug/
        else
          echo "Debug APK directory not found"
        fi
        
        echo "=== Checking AAB output ==="
        if [ -d "android/app/build/outputs/bundle/release" ]; then
          ls -la android/app/build/outputs/bundle/release/
        else
          echo "Release bundle directory not found"
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/
        if-no-files-found: warn

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: release-bundle
        path: android/app/build/outputs/bundle/release/
        if-no-files-found: warn

    - name: Run Android Unit Tests
      run: |
        cd android
        ./gradlew test --continue
      continue-on-error: true
      env:
        GRADLE_OPTS: -Xmx2048m

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: android/app/build/reports/tests/
        if-no-files-found: warn

    - name: Generate Build Report
      if: always()
      run: |
        echo "=== Build Report ==="
        echo "Date: $(date)"
        echo "Java Version: $(java -version 2>&1 | head -1)"
        echo "Gradle Version: $(cd android && ./gradlew -version 2>/dev/null | head -2)"
        echo "Node Version: $(node -v)"
        echo "NPM Version: $(npm -v)"
        echo ""
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Build completed successfully!"
        else
          echo "❌ Build failed. Review logs above for details."
        fi

    - name: Comment PR on failure
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Android build failed. Please check the workflow logs for details.'
          })

    - name: Comment PR on success
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Android build completed successfully! APK and AAB artifacts are ready for download.'
          })
