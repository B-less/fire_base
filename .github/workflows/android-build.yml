name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    # 1. Setup Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        cache: 'npm'

    # 2. Install your JavaScript dependencies
    - name: Install npm dependencies
      run: npm ci

    # 3. Build your web app (Angular/React/Vue)
    - name: Build Web Assets
      run: npm run build

    # 4. Sync Capacitor (This fixes the "No matching variant" error)
    - name: Sync Capacitor to Android
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --info
      working-directory: android
    
    - name: Build Release APK with Gradle
      run: ./gradlew assembleRelease --info
      working-directory: android
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
