name: Android Build

on:
  push:
    branches: [ main, develop, android/* ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        target: default
        arch: x86_64

    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      working-directory: ${{ github.workspace }}

    - name: Validate Gradle wrapper
      run: |
        cd android
        ls -la gradle/wrapper/
        ./gradlew -version

    - name: Build Android APK (Debug)
      run: |
        cd android
        ./gradlew clean assembleDebug
      env:
        GRADLE_OPTS: -Xmx2048m
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Build Android Bundle (Release)
      run: |
        cd android
        ./gradlew bundleRelease
      env:
        GRADLE_OPTS: -Xmx2048m
        JAVA_HOME: ${{ env.JAVA_HOME }}
      continue-on-error: true

    - name: Check APK output
      run: |
        echo "Checking for APK files..."
        find android/app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No output files found yet"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/
        if-no-files-found: warn

    - name: Upload Release Bundle
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: release-bundle
        path: android/app/build/outputs/bundle/release/
        if-no-files-found: warn

    - name: Run Android Unit Tests
      run: |
        cd android
        ./gradlew test --continue
      continue-on-error: true
      env:
        GRADLE_OPTS: -Xmx2048m

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: android/app/build/reports/tests/
        if-no-files-found: warn

    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Summary ==="
        echo "Java Version: $(java -version 2>&1 | head -1)"
        echo "Gradle Version: $(cd android && ./gradlew -version 2>/dev/null | head -2)"
        if [ ${{ job.status }} == 'success' ]; then
          echo "\n✅ Build completed successfully!"
        else
          echo "\n❌ Build failed. Check logs above."
        fi
